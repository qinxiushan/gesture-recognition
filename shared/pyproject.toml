[project]
name = "gesture-shared"
version = "0.1.0"
description = "Shared API contracts for the gesture robot system"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesture_shared"]

