[project]
name = "gesture-recognition-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "server", "client"]

[tool.uv.sources]
gesture-shared = { workspace = true }
gesture-server = { workspace = true }
gesture-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["client/src", "server/src", "shared/src"]
addopts = "-q"

