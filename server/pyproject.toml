[project]
name = "gesture-server"
version = "0.1.0"
description = "Jetson camera and DOFBOT control server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "gesture-shared",
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<4.12",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
gesture-server = "gesture_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesture_server"]

[tool.uv.sources]
gesture-shared = { workspace = true }

